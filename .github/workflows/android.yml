name: Android APK and emulator visual check
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack real interface assets
        run: |
          mkdir -p app/src/main/assets
          tar -xzf app_assets.tgz -C app/src/main/assets
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.js
          test -s app/src/main/assets/style.css
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: weather-with-you-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Install, launch and capture real Android emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p screenshots
            adb shell am force-stop com.prognostika.weatherwithyou || true
            adb shell am start -n com.prognostika.weatherwithyou/.MainActivity
            sleep 18
            adb exec-out screencap -p > screenshots/main.png
            test -s screenshots/main.png
            adb shell am force-stop com.prognostika.weatherwithyou || true
            adb shell am start -n com.prognostika.weatherwithyou/.MainActivity --es screen editor
            sleep 8
            adb exec-out screencap -p > screenshots/editor.png
            test -s screenshots/editor.png
            adb shell am force-stop com.prognostika.weatherwithyou || true
            adb shell am start -n com.prognostika.weatherwithyou/.MainActivity --es screen settings
            sleep 8
            adb exec-out screencap -p > screenshots/settings.png
            test -s screenshots/settings.png
            file screenshots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: screenshots/
          retention-days: 7
