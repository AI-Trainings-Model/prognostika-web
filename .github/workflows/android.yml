name: Android APK and emulator visual check
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack real interface assets
        run: |
          mkdir -p app/src/main/assets
          tar -xzf app_assets.tgz -C app/src/main/assets
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.js
          test -s app/src/main/assets/style.css
      - name: Install pixel-cropped render artwork
        run: |
          mkdir -p app/src/main/assets/render
          tar -xzf render_assets.tgz -C app/src/main/assets/render
          test -s app/src/main/assets/render/hero.webp
          test -s app/src/main/assets/render/hourly.webp
      - name: Apply modular editor refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app/src/main/assets/index.html')
          s=path.read_text(encoding='utf-8')
          s=s.replace('</head>', '<link rel="stylesheet" href="overrides.css"/></head>')
          s=s.replace('</body>', '<script src="enhancements.js"></script><script src="render-skin.js"></script></body>')
          s=s.replace('</head>', '<link rel="stylesheet" href="render-skin.css"/></head>')
          path.write_text(s,encoding='utf-8')
          PY
          test -s app/src/main/assets/overrides.css
          test -s app/src/main/assets/enhancements.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: weather-with-you-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Enable KVM acceleration for Android Emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device unavailable; emulator may run in slow software mode."
          fi
      - name: Install, launch and capture real Android emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p screenshots
            adb shell am force-stop com.prognostika.weatherwithyou || true
            adb shell am start -n com.prognostika.weatherwithyou/.MainActivity
            sleep 18
            adb shell screencap -p /data/local/tmp/main.png
            adb pull /data/local/tmp/main.png screenshots/main.png
            test -s screenshots/main.png
            adb shell input swipe 520 1800 520 770 550
            sleep 3
            adb shell screencap -p /data/local/tmp/main-scroll.png
            adb pull /data/local/tmp/main-scroll.png screenshots/main-scroll.png
            test -s screenshots/main-scroll.png
            adb shell input tap 540 2180
            sleep 5
            adb shell screencap -p /data/local/tmp/editor.png
            adb pull /data/local/tmp/editor.png screenshots/editor.png
            test -s screenshots/editor.png
            adb shell input tap 900 2180
            sleep 5
            adb shell screencap -p /data/local/tmp/settings.png
            adb pull /data/local/tmp/settings.png screenshots/settings.png
            test -s screenshots/settings.png
            file screenshots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshots
          path: screenshots/
          retention-days: 7
