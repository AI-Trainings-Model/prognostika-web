<!doctype html>

<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prognostika.ai — Demo Feed</title>
  <!-- Tailwind via CDN (для GitHub Pages подходит) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Простой спарклайн без библиотек */
    .sparkline { width: 100%; height: 40px; }
    .card { @apply rounded-2xl shadow p-4 bg-white/90 border border-gray-100; }
    .badge { @apply text-xs px-2 py-0.5 rounded-full border; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="max-w-6xl mx-auto p-4 md:p-6">
    <div class="flex items-center justify-between gap-4">
      <h1 class="text-2xl md:text-3xl font-semibold">Prognostika.ai — Публичный демо‑фид</h1>
      <span id="lastUpdated" class="badge border-gray-300 bg-gray-100">Загрузка…</span>
    </div>
    <p class="text-sm text-gray-600 mt-2">Данные носят образовательный характер и не являются инвестсоветом.</p>
  </header> <main class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Фильтры -->
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <input id="search" type="search" placeholder="Фильтр по тикеру/компании…" class="border border-gray-300 rounded-xl px-3 py-2 w-full md:w-72" />
      <select id="sector" class="border border-gray-300 rounded-xl px-3 py-2">
        <option value="">Все сектора</option>
      </select>
      <select id="sort" class="border border-gray-300 rounded-xl px-3 py-2">
        <option value="fresh">Сначала свежие</option>
        <option value="change">По изменению %</option>
        <option value="sentiment">По сентименту</option>
        <option value="rsi">По RSI (перекуп/перепрод)</option>
      </select>
      <button id="refresh" class="ml-auto badge border-gray-300 bg-white hover:bg-gray-100">Обновить</button>
    </div><!-- Контейнер карточек -->
<div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>

<!-- Пагинатор (если потребуется) -->
<div id="pager" class="flex justify-center mt-6 hidden">
  <button id="moreBtn" class="badge border-gray-300 bg-white hover:bg-gray-100">Показать ещё</button>
</div>

  </main> <footer class="max-w-6xl mx-auto p-6 text-xs text-gray-500">
    <p>Источник: <code>/data/feed.json</code>. При недоступности файла отображается демо‑набор.</p>
  </footer> <script>
    // ======= Конфиг =======
    const FEED_URL = 'data/feed.json'; // структура ниже в комментарии
    const AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 минут

    // ======= Fallback демо‑данные (если feed.json не найден) =======
    const demoFeed = {
      updated_at: new Date().toISOString(),
      summary: { total: 8 },
      items: [
        { ticker: 'KTOS', name: 'Kratos Defense & Security', sector: 'Aerospace & Defense', price: 24.12, change_pct: 1.8, rsi14: 58, sentiment: 0.21, last_news: { title: 'Wins tactical drone contract', date: isoDaysAgo(0) }, horizon: '1D', spark: sparkMock(24.12) },
        { ticker: 'AVAV', name: 'AeroVironment', sector: 'Aerospace & Defense', price: 183.40, change_pct: -0.9, rsi14: 47, sentiment: 0.05, last_news: { title: 'New loitering munitions batch', date: isoDaysAgo(1) }, horizon: '1D', spark: sparkMock(183.40) },
        { ticker: 'SMCI', name: 'Super Micro Computer', sector: 'AI Servers', price: 889.20, change_pct: 2.7, rsi14: 62, sentiment: 0.34, last_news: { title: 'AI racks pre‑orders surge', date: isoDaysAgo(0) }, horizon: '1D', spark: sparkMock(889.2) },
        { ticker: 'PLTR', name: 'Palantir Technologies', sector: 'AI / Software', price: 42.75, change_pct: 0.6, rsi14: 55, sentiment: 0.40, last_news: { title: 'NATO pilot expands', date: isoDaysAgo(2) }, horizon: '1D', spark: sparkMock(42.75) },
        { ticker: 'RCAT', name: 'Red Cat Holdings', sector: 'Drones', price: 0.87, change_pct: -1.2, rsi14: 44, sentiment: -0.05, last_news: { title: 'Latin America export discussed', date: isoDaysAgo(3) }, horizon: '1D', spark: sparkMock(0.87) },
        { ticker: 'BA', name: 'Boeing', sector: 'Aerospace & Defense', price: 164.30, change_pct: 0.3, rsi14: 49, sentiment: -0.12, last_news: { title: 'Delivery schedule update', date: isoDaysAgo(1) }, horizon: '1D', spark: sparkMock(164.3) },
        { ticker: 'LLY', name: 'Eli Lilly', sector: 'Pharma / Biotech', price: 915.60, change_pct: 0.9, rsi14: 59, sentiment: 0.26, last_news: { title: 'Obesity drug capacity news', date: isoDaysAgo(0) }, horizon: '1D', spark: sparkMock(915.6) },
        { ticker: 'AAPL', name: 'Apple', sector: 'Consumer Tech', price: 224.10, change_pct: -0.4, rsi14: 51, sentiment: 0.02, last_news: { title: 'Supply chain note', date: isoDaysAgo(2) }, horizon: '1D', spark: sparkMock(224.1) }
      ]
    };

    // ======= Состояние =======
    let state = { full: demoFeed, filtered: [], page: 1, pageSize: 30 };

    // ======= Утилиты =======
    function isoDaysAgo(n){ const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString(); }
    function fmtPct(x){ return (x>0?'+':'') + x.toFixed(2) + '%'; }
    function ago(iso){ const d = new Date(iso); const diff = Date.now()-d.getTime(); const m = Math.round(diff/60000); if(m<60) return m+" мин назад"; const h=Math.round(m/60); if(h<24) return h+" ч назад"; const dd=Math.round(h/24); return dd+" дн назад"; }
    function badgeColorByChange(p){ if(p>1) return 'bg-green-50 text-green-700 border-green-200'; if(p< -1) return 'bg-red-50 text-red-700 border-red-200'; return 'bg-gray-50 text-gray-700 border-gray-200'; }
    function badgeColorByRSI(r){ if(r>=70) return 'bg-amber-50 text-amber-700 border-amber-200'; if(r<=30) return 'bg-blue-50 text-blue-700 border-blue-200'; return 'bg-gray-50 text-gray-700 border-gray-200'; }
    function badgeColorBySent(s){ if(s>0.2) return 'bg-green-50 text-green-700 border-green-200'; if(s<-0.2) return 'bg-red-50 text-red-700 border-red-200'; return 'bg-gray-50 text-gray-700 border-gray-200'; }
    function sparkMock(base){ // генератор псевдо‑спарклайна
      const pts = []; let v = base; for(let i=0;i<30;i++){ v += (Math.random()-0.5) * (base*0.01); pts.push(Math.max(0.01, v)); } return pts; }

    function drawSparkline(container, values){
      const w = container.clientWidth || 280; const h = 40; const min = Math.min(...values), max = Math.max(...values);
      const dx = w / (values.length-1); const mapY = v => h - ((v-min)/(max-min||1))*h;
      let d = '';
      values.forEach((v,i)=>{ const x=i*dx; const y=mapY(v); d += (i? ' L':'M')+x.toFixed(1)+' '+y.toFixed(1); });
      container.innerHTML = `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <path d="${d}" fill="none" stroke="currentColor" stroke-width="1.5"></path>
      </svg>`;
    }

    // ======= Рендер =======
    function render(){
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const items = paginate(state.filtered.length ? state.filtered : state.full.items, state.page, state.pageSize);

      items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-lg font-semibold">${it.ticker}</span>
                <span class="badge border-gray-300 bg-gray-50">${it.horizon||'1D'}</span>
              </div>
              <div class="text-sm text-gray-600">${it.name||''}</div>
            </div>
            <div class="text-right">
              <div class="text-xl font-semibold">$${it.price?.toFixed(2)??'—'}</div>
              <div class="text-sm ${it.change_pct>=0?'text-green-600':'text-red-600'}">${fmtPct(it.change_pct||0)}</div>
            </div>
          </div>
          <div class="mt-3 text-xs flex items-center gap-2">
            <span class="badge ${badgeColorByRSI(it.rsi14)}">RSI: ${it.rsi14??'—'}</span>
            <span class="badge ${badgeColorBySent(it.sentiment)}">Sentiment: ${(it.sentiment??0).toFixed(2)}</span>
            <span class="badge ${badgeColorByChange(it.change_pct)}">Δ: ${fmtPct(it.change_pct||0)}</span>
          </div>
          <div class="mt-3"><div class="spark" aria-hidden="true"></div></div>
          <div class="mt-3 text-sm">
            <div class="text-gray-700 line-clamp-2">📰 ${it.last_news?.title || 'Новости не найдены'}</div>
            <div class="text-xs text-gray-500">${it.last_news?.date ? ago(it.last_news.date) : '—'}</div>
          </div>
          <div class="mt-3 text-xs text-gray-500">Сектор: ${it.sector||'—'}</div>
        `;
        grid.appendChild(card);
        // отрисовка спарклайна
        const sparkHost = card.querySelector('.spark');
        drawSparkline(sparkHost, (it.spark && it.spark.length ? it.spark : sparkMock(it.price||1)));
      });

      document.getElementById('lastUpdated').textContent = 'Обновлено: ' + fmtDate(state.full.updated_at);
    }

    function fmtDate(iso){ try{ const d=new Date(iso); return d.toLocaleString('ru-RU'); }catch{ return '—'; } }
    function paginate(arr, page, pageSize){ if(!arr) return []; const start=(page-1)*pageSize; return arr.slice(start, start+pageSize); }

    // ======= Фильтрация / сортировка =======
    function applyFilters(){
      const q = document.getElementById('search').value.trim().toLowerCase();
      const sec = document.getElementById('sector').value;
      const sort = document.getElementById('sort').value;

      let arr = [...state.full.items];
      if(q) arr = arr.filter(x => (x.ticker||'').toLowerCase().includes(q) || (x.name||'').toLowerCase().includes(q));
      if(sec) arr = arr.filter(x => x.sector === sec);

      if(sort === 'fresh'){
        arr.sort((a,b)=> new Date(b.last_news?.date||0) - new Date(a.last_news?.date||0));
      } else if(sort === 'change'){
        arr.sort((a,b)=> (Math.abs(b.change_pct||0) - Math.abs(a.change_pct||0)));
      } else if(sort === 'sentiment'){
        arr.sort((a,b)=> (b.sentiment||0) - (a.sentiment||0));
      } else if(sort === 'rsi'){
        arr.sort((a,b)=> (b.rsi14||0) - (a.rsi14||0));
      }

      state.filtered = arr;
      state.page = 1;
      render();
      populateSectors();
    }

    function populateSectors(){
      const sel = document.getElementById('sector');
      const opts = new Set((state.filtered.length?state.filtered:state.full.items).map(x=>x.sector).filter(Boolean));
      const current = sel.value;
      sel.innerHTML = '<option value="">Все сектора</option>' + Array.from(opts).sort().map(s=>`<option ${s===current?'selected':''} value="${s}">${s}</option>`).join('');
    }

    // ======= Загрузка фида =======
    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL, { cache: 'no-store' });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const json = await res.json();
        if(!json || !Array.isArray(json.items)) throw new Error('bad schema');
        state.full = json;
      }catch(e){
        console.warn('Feed недоступен, используем демо‑данные:', e);
        state.full = demoFeed;
      }
      state.filtered = [];
      populateSectors();
      render();
    }

    // ======= Авто‑обновление =======
    setInterval(loadFeed, AUTO_REFRESH_MS);

    // ======= Слушатели =======
    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('sector').addEventListener('change', applyFilters);
    document.getElementById('sort').addEventListener('change', applyFilters);
    document.getElementById('refresh').addEventListener('click', loadFeed);

    // ======= Старт =======
    loadFeed();
  </script> <!-- ==========================
  Пример структуры data/feed.json (положить в /data/feed.json в том же репо)
  {
    "updated_at": "2025-10-14T06:59:00+02:00",
    "summary": { "total": 8 },
    "items": [
      {
        "ticker": "PLTR",
        "name": "Palantir Technologies",
        "sector": "AI / Software",
        "price": 42.75,
        "change_pct": 0.62,
        "rsi14": 55,
        "sentiment": 0.40,
        "last_news": { "title": "NATO pilot expands", "date": "2025-10-12T16:10:00+02:00" },
        "horizon": "1D",
        "spark": [41.7, 42.0, 41.9, 42.1, 42.5, 42.3, 42.75]
      }
    ]
  }
  =========================== --></body>
</html>
