<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prognostika.ai — Demo</title>
<style>
body{margin:0;background:#fafafa;color:#0a0a0a;font:14px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid #eaeaea;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.head{padding:14px 16px;border-bottom:1px solid #eaeaea;display:flex;justify-content:space-between;align-items:center}
.title{font-weight:700}.sub{font-size:12px;color:#666}
.btn{appearance:none;border:none;background:#111;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div><div class="title">Prognostika.ai — forecasting (demo)</div>
        <div class="sub">Mathematical model trained on retrospective data. Demo only.</div></div>
    </div>
    <div style="padding:16px">
      <label>Stock / ticker: <input id="t" placeholder="AAPL, BAS" style="margin:8px"></label><br>
      <button class="btn" id="r">Run forecast</button>
      <div id="res" style="margin-top:12px;display:none"><b>Demo result:</b> short-term forecast generated.</div>
    </div>
  </div>
</div>
<script>
async function loadForecast() {
  const res = await fetch("./api/forecast.json?ts=" + Date.now());
  if (!res.ok) throw new Error("Cannot load forecast");
  return await res.json();
}
document.getElementById("r").onclick = async () => {
  const btn = document.getElementById("r");
  const resBox = document.getElementById("res");
  btn.disabled = true; btn.textContent = "Running…";
  try {
    const data = await loadForecast();
    resBox.style.display = "block";
    resBox.innerHTML = 
      <b>${data.ticker}</b> — ${data.analysis_type}<br>
      <div style="margin-top:6px">
        <b>Short:</b> ${data.short.summary}<br>
        Prob↑: ${(data.short.prob_up*100).toFixed(1)}%,
        Confidence: ${(data.short.confidence*100).toFixed(0)}%
      </div>
      <div style="font-size:12px;color:#666;margin-top:6px">
        Updated: ${new Date(data.generated_at).toLocaleString()}
      </div>;
  } catch(e){ alert("Demo error: "+e.message); }
  finally { btn.disabled = false; btn.textContent = "Run forecast"; }
};
</script>
</body>
</html>
