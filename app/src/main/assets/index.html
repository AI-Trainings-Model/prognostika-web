<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"><meta name="theme-color" content="#102a44"><title>Weather With You</title>
<style>
:root{font-family:Roboto,"Arial",sans-serif;color:#eef7ff;background:#112d49;--glass:rgba(24,55,82,.79);--border:rgba(255,255,255,.23);--blue:#2380f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 65% 15%,#5889b4 0%,transparent 48%),linear-gradient(165deg,#163f68 0%,#577b93 40%,#947b61 75%,#283f55 100%);background-attachment:fixed}button,select,input{font:inherit}button{cursor:pointer;border:0}header{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 6px;position:sticky;top:0;z-index:10;background:linear-gradient(#163755ee,#163755bb);backdrop-filter:blur(16px)}header strong{font-size:21px}header small{display:block;color:#dae9fa;font-size:12px;margin-top:3px}.headbtn{border-radius:13px;background:#ffffff28;color:white;font-size:21px;width:38px;height:38px}.headright{display:flex;gap:8px}.tabbar{display:flex;margin:12px 15px;gap:5px;padding:4px;border-radius:20px;background:#15345088}.tabbar button{color:#d5e6f6;background:transparent;padding:11px 4px;flex:1;border-radius:17px;font-size:13px}.tabbar button.active{background:#dbeaff;color:#183957;font-weight:700}.page{padding:0 14px 28px;max-width:780px;margin:auto}.hero{min-height:400px;border:1px solid #ffffff38;border-radius:26px;overflow:hidden;position:relative;background:radial-gradient(ellipse at top right,#f4b66d7a,transparent 50%),linear-gradient(160deg,#2e6397 5%,#4b6e82 51%,#68583e 100%);box-shadow:0 12px 25px #061b3338}.hero:after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,#102d41a0);pointer-events:none}.scene{position:absolute;bottom:0;right:0;width:69%;height:100%;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}.scene .people{font-size:100px;line-height:1.55;filter:drop-shadow(0 9px 12px #15243790);letter-spacing:-29px;white-space:nowrap}.hero-top{padding:17px;position:relative;z-index:1;text-shadow:0 2px 10px #1235}.bigtemp{font-size:83px;font-weight:300;line-height:1.12;letter-spacing:-6px}.condition{font-size:15px;margin:8px 0;max-width:178px;line-height:1.35}.desc{font-size:13px}.hero .minor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:182px;gap:7px;margin-top:18px}.hero .minor span{background:#173e6288;border:1px solid #ffffff36;padding:9px;border-radius:13px;font-size:12px}.hero-bottom{position:absolute;z-index:2;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 18px;background:#0e284c55;font-size:12px}.hero-bottom b{display:block;margin-top:4px;font-size:16px}.card{background:var(--glass);border:1px solid var(--border);border-radius:22px;margin-top:12px;padding:16px 13px;box-shadow:0 9px 20px #10233726;backdrop-filter:blur(14px)}.cardhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;font-size:15px;font-weight:700}.cardhead button{background:#ffffff15;color:white;border-radius:12px;padding:7px 10px}.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hour{min-width:63px;padding:10px 7px;border:1px solid #ffffff21;border-radius:14px;text-align:center;background:#ffffff10}.hour small{display:block;font-size:11px;color:#c8d9e8}.hour .symbol{font-size:28px;margin:8px 0}.hour b{font-size:16px}.hour em{font-size:11px;font-style:normal;color:#b1d5ef;display:block;margin-top:5px}.day{display:grid;grid-template-columns:1fr 40px 50px 40px;align-items:center;border-bottom:1px solid #ffffff20;padding:11px 3px;font-size:14px}.day:last-child{border:0}.day .weather{font-size:22px}.day .low{opacity:.7}.indicators{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.indicator{background:#ffffff0d;border:1px solid #ffffff26;border-radius:16px;padding:12px}.indicator small{color:#d9e8f5;display:block;margin:3px 0 8px;font-size:12px}.indicator b{font-size:21px;font-weight:500}.indicator .unit{font-size:11px}.outfit{display:flex;gap:8px;overflow:auto}.outfit span{min-width:76px;text-align:center;background:#ffffff17;border-radius:14px;padding:12px 5px;font-size:34px}.outfit small{display:block;font-size:11px;margin-top:5px}.map{height:250px;border-radius:15px;background:repeating-radial-gradient(ellipse at 60% 65%,#5797bd9c 0 11px,#367fa290 12px 18px,#2c5f7688 22px 35px),linear-gradient(45deg,#295a54,#1b4c6d);position:relative;overflow:hidden}.map:after{content:"Берлин";position:absolute;top:48%;left:44%;font-size:16px;text-shadow:0 1px 4px black}.pill{border-radius:14px;padding:10px;background:#ffffff24;color:white}.action{background:var(--blue);color:white;border-radius:13px;padding:13px;font-weight:600}.full{width:100%}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar button{flex:1}.muted{color:#c5d9ed;font-size:12px;line-height:1.5}.setup{display:flex;gap:8px;flex-wrap:wrap}.setup button{border:1px solid #ffffff44;background:#ffffff15;color:white;border-radius:12px;padding:11px 13px}.setup button.selected{background:#267df5;border-color:white}.editrow{display:flex;gap:9px;align-items:center;justify-content:space-between;background:#ffffff15;border:1px solid #ffffff33;padding:12px;margin:8px 0;border-radius:14px}.editrow label{flex:1}.editrow .mini{padding:5px 8px;border-radius:9px;background:#ffffff27;color:white;font-size:17px}.editrow .handle{font-size:20px;touch-action:none;cursor:grab}.rowtitle{font-weight:700;font-size:14px}.settingsgroup{padding:13px 15px;background:#ffffff10;border:1px solid #ffffff26;border-radius:15px;margin:10px 0}.settingsgroup h3{font-size:16px;margin:3px 0 12px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #ffffff1d}.line:first-of-type{border-top:0}.line select{background:#123956;color:white;border:1px solid #ffffff44;border-radius:10px;padding:8px;max-width:150px}.line input[type=range]{width:130px}.badge{padding:4px 8px;border-radius:12px;background:#2778d8;font-size:11px}.hidden{display:none!important}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:30;padding:12px 18px;border-radius:15px;background:#f1f7ff;color:#172b48;box-shadow:0 12px 40px #0007;font-size:13px;min-width:220px;text-align:center}.refresh{font-size:13px;color:#b6d4ec;padding:10px;text-align:center}.loading .symbol{animation:rotate 1s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}#screen-settings{padding-bottom:40px}#top-pull{position:fixed;top:75px;left:50%;transform:translateX(-50%);border-radius:100px;background:#e9f5ff;color:#214669;padding:10px 16px;z-index:8;box-shadow:0 6px 20px #0004;font-size:13px}.pickercard{background:#ffffff0e;border:1px solid #ffffff30;border-radius:18px;padding:12px;margin:8px 0}#module-list{touch-action:pan-y}body.light{background:linear-gradient(160deg,#a9cfee,#f1d3ae)}body.light .card{background:#28557dd9}@media(min-width:700px){.page{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:12px}.page>.hero{grid-row:span 2}.page>.card{margin-top:0}.page>.toolbar{grid-column:1/-1}} 
</style></head><body>
<header><div><strong id="city">Берлин⌖</strong><small id="dated">Ср, 21 окт · Обновление…</small></div><div class="headright"><button class="headbtn" onclick="refreshAll()" aria-label="Обновить">⟳</button><button class="headbtn" onclick="showScreen('settings')" aria-label="Настройки">⚙</button></div></header>
<div id="top-pull" class="hidden">↓ Отпустите для обновления</div>
<nav class="tabbar" id="navigation"><button class="active" onclick="showScreen('weather')">Прогноз</button><button onclick="showScreen('radar')">Карта</button><button onclick="showScreen('editor')">Редактор</button><button onclick="showScreen('settings')">Настройки</button></nav>
<main id="screen-weather" class="page"></main>
<main id="screen-radar" class="page hidden"></main>
<main id="screen-editor" class="page hidden"></main>
<main id="screen-settings" class="page hidden"></main>
<div id="toast" class="toast hidden"></div>
<script>
const api = window.WeatherAndroid || {readConfig:()=>localStorage.getItem('config')||'',saveConfig:x=>localStorage.setItem('config',x),cacheWeather:()=>{},version:()=>'web-preview',openUpdates:()=>alert('Проверка обновлений доступна в APK'),openUrl:x=>window.open(x)};
const definitions=[['hero','Текущая погода и персонажи'],['hourly','Почасовой прогноз'],['daily','Прогноз на 10 дней'],['outfit','Что надеть сегодня'],['metrics','Подробные показатели'],['radar','Карта осадков'],['advice','Советы для семьи'],['alerts','Предупреждения']];
const defaults={order:definitions.map(x=>x[0]),visible:definitions.map(x=>x[0]),family:['female'],city:'Берлин',lat:52.52,lon:13.405,units:'celsius',theme:'auto',alpha:78,size:'medium',lastUpdated:null};
let state={...defaults};try{let saved=JSON.parse(api.readConfig()||'{}');state={...state,...saved}}catch(e){}
let data=null,lastTouch=0,moveTouch=0,currentScreen='weather',toastTimer=null;
function save(){api.saveConfig(JSON.stringify(state));render()}
function notify(msg){let n=document.getElementById('toast');n.textContent=msg;n.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.add('hidden'),3000)}
function weatherIcon(code){if([0].includes(code))return '☀️';if([1,2].includes(code))return '🌤️';if(code===3)return '☁️';if([45,48].includes(code))return '🌫️';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return '🌧️';if([71,73,75,77,85,86].includes(code))return '🌨️';if([95,96,99].includes(code))return '⛈️';return '🌤️'}
function summary(code){if(code===0)return 'Ясно';if(code<=2)return 'Переменная облачность';if(code===3)return 'Облачно';if(code<51)return 'Туман';if(code<71)return 'Дождь';if(code<90)return 'Снег или ливень';return 'Гроза'}
function round(x){return Math.round(Number(x||0))}
function clock(d){return new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function dateLabel(d){return new Date(d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})}
function character(p){return ({male:'🧍🏻‍♂️',female:'🧍🏻‍♀️',child:'🧒🏻',dog:'🐕',cat:'🐈'})[p]||'🧍'}
function familyScene(){return state.family.map(character).join('')}
function hero(){let c=data?.current||{},w=summary(c.weather_code??2),temp=round(c.temperature_2m??12);return '<section class="hero"><div class="scene"><span class="people">'+familyScene()+'</span></div><div class="hero-top"><div style="font-size:14px">⌖ '+state.city+'</div><div class="bigtemp">'+temp+'°'+weatherIcon(c.weather_code??2)+'</div><div class="condition">'+w+'</div><div class="desc">Ощущается как '+round(c.apparent_temperature??temp)+'°</div><div class="minor"><span>☂ Осадки<br><b>'+round(c.precipitation??0)+' мм</b></span><span>☷ Ветер<br><b>'+round(c.wind_speed_10m??3)+' км/ч</b></span><span>💧 Влажность<br><b>'+round(c.relative_humidity_2m??68)+'%</b></span><span>☀ УФ-индекс<br><b>'+round(data?.daily?.uv_index_max?.[0]??2)+'</b></span></div></div><div class="hero-bottom">'+(data?.hourly?.time||[]).slice(0,5).map((t,i)=>'<div>'+ (i===0?'Сейчас':clock(t))+'<b>'+weatherIcon(data.hourly.weather_code[i])+round(data.hourly.temperature_2m[i])+'°</b></div>').join('')+'</div></section>'}
function hourTiles(){let h=data?.hourly||{};let indices=(h.time||[]).map((t,i)=>i).filter(i=>new Date(h.time[i]).getTime()>=Date.now()-3600000).slice(0,24);return '<section class="card"><div class="cardhead">Почасовой прогноз <button onclick="refreshModule(\'hourly\')">⟳</button></div><div class="hours">'+(indices.length?indices.map(i=>'<div class="hour"><small>'+clock(h.time[i])+'</small><div class="symbol">'+weatherIcon(h.weather_code[i])+'</div><b>'+round(h.temperature_2m[i])+'°</b><em>☂ '+round(h.precipitation_probability[i])+'%</em></div>').join(''):'<div class="muted">Данные загружаются…</div>')+'</div></section>'}
function days(){let d=data?.daily||{};return '<section class="card"><div class="cardhead">Прогноз на 10 дней <button onclick="refreshModule(\'daily\')">⟳</button></div>'+(d.time||[]).map((t,i)=>'<div class="day"><span>'+dateLabel(t)+'</span><span class="weather">'+weatherIcon(d.weather_code[i])+'</span><b>'+round(d.temperature_2m_max[i])+'°</b><span class="low">'+round(d.temperature_2m_min[i])+'°</span></div>').join('')+'</section>'}
function clothes(){let t=round(data?.current?.apparent_temperature??12);let items=t<5?[['🧥','Тёплая куртка'],['🧣','Шарф'],['🥾','Ботинки'],['🧤','Перчатки']]:t<15?[['🧥','Куртка'],['🧶','Свитер'],['👖','Джинсы'],['👟','Обувь']]:[['👕','Футболка'],['👖','Лёгкие брюки'],['👟','Кроссовки'],['🧢','Головной убор']];return '<section class="card"><div class="cardhead">Что надеть сегодня <button onclick="refreshModule(\'outfit\')">⟳</button></div><div class="outfit">'+items.map(x=>'<span>'+x[0]+'<small>'+x[1]+'</small></span>').join('')+'</div></section>'}
function metrics(){let c=data?.current||{};let items=[['🌡','Температура',round(c.temperature_2m??12)+'°'],['💧','Влажность',round(c.relative_humidity_2m??68)+'%'],['☂','Осадки',round(c.precipitation??0)+' мм'],['☷','Ветер',round(c.wind_speed_10m??3)+' км/ч'],['◉','Давление',round(c.surface_pressure??1013)+' гПа'],['☀','УФ-индекс',round(data?.daily?.uv_index_max?.[0]??2)]];return '<section class="card"><div class="cardhead">Подробные показатели <button onclick="refreshModule(\'metrics\')">⟳</button></div><div class="indicators">'+items.map(x=>'<div class="indicator"><div>'+x[0]+'</div><small>'+x[1]+'</small><b>'+x[2]+'</b></div>').join('')+'</div></section>'}
function radar(){return '<section class="card"><div class="cardhead">Карта осадков <button onclick="refreshModule(\'radar\')">⟳</button></div><div class="map"></div><p class="muted">Демонстрационный фон — настоящий радар осадков ещё не подключён.</p></section>'}
function advice(){let t=round(data?.current?.apparent_temperature??12);return '<section class="card"><div class="cardhead">Для всей семьи <button onclick="refreshModule(\'advice\')">⟳</button></div><p>'+familyScene()+'</p><p>'+(t<10?'Прохладно: наденьте тёплую одежду и защитите ребёнка от ветра.':t<20?'Комфортно для прогулки. Возьмите дополнительный слой одежды для ребёнка.':'Тепло: следите за перегревом и обеспечьте воду взрослым.')+'</p></section>'}
function alerts(){return '<section class="card"><div class="cardhead">Предупреждения <button onclick="refreshModule(\'alerts\')">⟳</button></div><p class="muted">Региональные экстренные предупреждения пока не подключены. Данные о погоде — не система оповещения об опасностях.</p></section>'}
const renderers={hero,hourly:hourTiles,daily:days,outfit:clothes,metrics,radar,advice,alerts};
function renderWeather(){document.getElementById('screen-weather').innerHTML=state.order.filter(id=>state.visible.includes(id)).map(id=>renderers[id]?.()||'').join('')+'<div class="refresh">'+(state.lastUpdated?'Обновлено '+clock(state.lastUpdated):'Ожидание обновления')+' · Потяните вниз, чтобы обновить</div>'}
function renderRadar(){document.getElementById('screen-radar').innerHTML=radar()+hourTiles()}
let dragIndex=null;
function renderEditor(){let root=document.getElementById('screen-editor');root.innerHTML='<section class="card"><h2 style="margin:0 0 5px">Редактор виджета</h2><p class="muted">Перетаскивайте блоки за ⠿, включайте и выключайте, открывайте ✎ для настройки.</p><div id="module-list">'+state.order.map((id,i)=>{let d=definitions.find(x=>x[0]===id);return '<div class="editrow" draggable="true" data-index="'+i+'"><span class="handle">⠿</span><label><div class="rowtitle">'+d[1]+'</div><small class="muted">'+(state.visible.includes(id)?'Включён':'Выключен')+'</small></label><input type="checkbox" '+(state.visible.includes(id)?'checked':'')+' onchange="toggleModule(\''+id+'\')"><button class="mini" onclick="configureModule(\''+id+'\')">✎</button><button class="mini" onclick="moveModule('+i+',-1)">↑</button><button class="mini" onclick="moveModule('+i+',1)">↓</button></div>'}).join('')+'</div><button class="action full" onclick="showScreen(\'weather\')">Предпросмотр на экране</button></section>';root.querySelectorAll('[draggable]').forEach(el=>{el.addEventListener('dragstart',()=>dragIndex=Number(el.dataset.index));el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();let i=Number(el.dataset.index);moveFromTo(dragIndex,i)})})}
function toggleModule(id){state.visible=state.visible.includes(id)?state.visible.filter(x=>x!==id):[...state.visible,id];save()}
function moveFromTo(a,b){if(a==null||a===b||a<0||b<0)return;state.order.splice(b,0,state.order.splice(a,1)[0]);save()}
function moveModule(i,d){moveFromTo(i,i+d)}
function configureModule(id){let d=definitions.find(x=>x[0]===id);if(id==='hero'||id==='advice')showScreen('settings');else notify(d[1]+': положение и видимость редактируются в списке')}
const compositions=[['female','Ж'],['male','М'],['male,female','М + Ж'],['male,child','М + Р'],['female,child','Ж + Р'],['male,female,child','М + Ж + Р'],['male,female,child,dog','Семья + собака'],['male,female,child,cat','Семья + кот']];
function renderSettings(){document.getElementById('screen-settings').innerHTML='<section class="card"><h2 style="margin:0 0 8px">Настройки персонажей</h2><p class="muted">Выберите состав семьи. Пол владельца телефона не определяется Android автоматически: выбор делается вручную.</p><div class="setup">'+compositions.map(([f,l])=>'<button class="'+(state.family.join(',')===f?'selected':'')+'" onclick="setFamily(\''+f+'\')">'+l+'</button>').join('')+'</div><p class="muted">Можно добавить больше одного ребёнка и питомцев:</p><div class="setup">'+[['male','+ Мужчина'],['female','+ Женщина'],['child','+ Ребёнок'],['dog','+ Собака'],['cat','+ Кот']].map(([f,l])=>'<button onclick="addFamily(\''+f+'\')">'+l+'</button>').join('')+'<button onclick="removeFamily()">− Последний</button></div><p style="font-size:34px;margin:12px 0">'+familyScene()+'</p></section><section class="card"><h2>Оформление</h2><div class="settingsgroup"><div class="line"><span>Тема</span><select onchange="state.theme=this.value;save()"><option value="auto">Авто</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div><div class="line"><span>Прозрачность</span><input type="range" min="35" max="95" value="'+state.alpha+'" oninput="state.alpha=+this.value;setAlpha()" onchange="save()"></div><div class="line"><span>Размер модуля</span><select onchange="state.size=this.value;save()"><option value="small">Маленький</option><option value="medium">Средний</option><option value="large">Большой</option></select></div></div><button class="pill full" onclick="showScreen(\'editor\')">Управление модулями →</button></section><section class="card"><h2>Местоположение и данные</h2><div class="line"><span>Город</span><span id="location-name">'+state.city+'</span></div><button class="pill full" onclick="requestLocation()">⌖ Определить местоположение</button><button class="pill full" style="margin-top:8px" onclick="refreshAll()">⟳ Обновить весь прогноз</button></section><section class="card"><h2>Обновление приложения</h2><p class="muted">Установлена версия '+api.version()+'. Проверка выполняется по опубликованному JSON-манифесту GitHub. Установка новой APK подтверждается Android.</p><button class="action full" onclick="api.openUpdates()">Проверить обновления APK</button></section>';document.querySelector('#screen-settings select').value=state.theme;document.querySelectorAll('#screen-settings select')[1].value=state.size}
function setFamily(s){state.family=s.split(',');save()}function addFamily(s){if(state.family.length>=8)return notify('Не более восьми персонажей');state.family.push(s);save()}function removeFamily(){state.family.pop();save()}
function setAlpha(){document.documentElement.style.setProperty('--glass','rgba(24,55,82,'+(state.alpha/100)+')')}
function render(){setAlpha();document.body.classList.toggle('light',state.theme==='light');document.getElementById('city').textContent=state.city+'⌖';document.getElementById('dated').textContent=dateLabel(new Date())+(state.lastUpdated?' · '+clock(state.lastUpdated):' · ожидание данных');renderWeather();renderRadar();renderEditor();renderSettings()}
function showScreen(which){currentScreen=which;['weather','radar','editor','settings'].forEach((s,i)=>{document.getElementById('screen-'+s).classList.toggle('hidden',s!==which);document.querySelectorAll('.tabbar button')[i].classList.toggle('active',s===which)});window.scrollTo(0,0)}
window.weatherBack=()=>showScreen('weather');
let refreshing=false;async function refreshAll(){if(refreshing)return;refreshing=true;notify('Обновление прогноза…');try{const unit=state.units==='fahrenheit'?'fahrenheit':'celsius';const q='https://api.open-meteo.com/v1/forecast?latitude='+state.lat+'&longitude='+state.lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,surface_pressure&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&forecast_days=10&timezone=auto&temperature_unit='+unit;let response=await fetch(q);if(!response.ok)throw Error(response.status);data=await response.json();state.lastUpdated=new Date().toISOString();api.cacheWeather(state.city,round(data.current.temperature_2m)+'°',summary(data.current.weather_code));save();notify('Прогноз обновлён · '+clock(state.lastUpdated))}catch(e){notify('Нет соединения с погодным сервисом. Проверьте интернет.')}finally{refreshing=false}}
async function refreshModule(id){notify('Обновление: '+definitions.find(x=>x[0]===id)?.[1]);await refreshAll()}
function requestLocation(){if(!navigator.geolocation){notify('Геолокация недоступна');return}navigator.geolocation.getCurrentPosition(async p=>{state.lat=p.coords.latitude;state.lon=p.coords.longitude;state.city='Моё местоположение';try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name=Berlin&count=1');}catch(e){}save();await refreshAll()},()=>notify('Доступ к местоположению не предоставлен'),{timeout:10000})}
document.addEventListener('touchstart',e=>{if(window.scrollY<=5)lastTouch=e.touches[0].clientY;else lastTouch=0},{passive:true});document.addEventListener('touchmove',e=>{if(lastTouch){moveTouch=e.touches[0].clientY-lastTouch;document.getElementById('top-pull').classList.toggle('hidden',moveTouch<80)}},{passive:true});document.addEventListener('touchend',()=>{if(moveTouch>95&&lastTouch){refreshAll()}lastTouch=0;moveTouch=0;document.getElementById('top-pull').classList.add('hidden')});
render();refreshAll();
</script></body></html>
